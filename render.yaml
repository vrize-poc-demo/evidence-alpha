services:
  - type: web
    name: evidence-alpha
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: LLM_PROVIDER
        value: openai
      - key: LLM_MODEL
        value: gpt-4.1-mini
      - key: USE_LLM
        value: true
      - key: OPENAI_API_KEY
        sync: false
